name: Verify portfolio
on:
  push:
    branches: [portfolio-refresh]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile --ignore-scripts
      - run: corepack yarn test:ci
      - run: corepack yarn build:portfolio
      - run: corepack yarn playwright install --with-deps chromium
      - run: corepack yarn test:e2e:portfolio

  visitor-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: brennanbutler01/case-reviews-api
          ref: beb420fdd488dcc43daa1b84fdd0e46101030543
          path: companion-api
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile --ignore-scripts
      - run: corepack yarn playwright install --with-deps chromium
      - name: Generate disposable signing key
        run: python3 -c 'import os,secrets; open(os.environ["GITHUB_ENV"], "a").write("VISITOR_DEMO_SIGNING_KEY=" + secrets.token_urlsafe(48) + "\n")'
      - run: docker compose -f companion-api/compose.visitor.yaml up --build -d
      - name: Wait for API
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:5210/health > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: corepack yarn test:e2e:visitor
      - if: always()
        run: docker compose -f companion-api/compose.visitor.yaml down -v
