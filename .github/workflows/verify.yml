name: Verify portfolio
on:
  push:
    branches: [portfolio-refresh]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile --ignore-scripts
      - run: corepack yarn test:ci
      - run: corepack yarn build:portfolio
      - run: corepack yarn playwright install --with-deps chromium
      - run: corepack yarn test:e2e:portfolio
